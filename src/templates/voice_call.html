<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Call</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='voice_call.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Status Indicator -->
        <div class="status-bar">
            <span id="connection-status" class="status-dot disconnected"></span>
            <span id="status-text">Ready to call</span>
        </div>

        <!-- Main Visualizer -->
        <div class="visualizer-container">
            <div id="orb" class="orb idle"></div>
            <div class="waves">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Transcript Area (Hidden by default, toggles up) -->
        <div class="transcript-container">
            <div id="transcript" class="transcript-box">
                <div class="message system">Start a call to begin conversation...</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="call-btn" class="control-btn call">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.49-5.15-3.8-6.64-6.64l1.97-1.57c.26-.26.35-.65.24-1.01A11.36 11.36 0 0 1 8.5 4.25c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 14.5 14.5 0 0 0 14.5 14.5c.55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/>
                </svg>
            </button>
            <button id="hangup-btn" class="control-btn hangup hidden">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 0 1 0-1.41C4.59 7.52 8.06 5.5 12 5.5s7.41 2.02 11.71 6.17c.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='voice_call.js') }}"></script>
</body>
</html>
